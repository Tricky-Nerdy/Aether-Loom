name: Validate Aether Loom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax validation
        run: python -m compileall -q .
      - name: Expression layer regression tests
        run: python -m unittest discover -s tests -p 'test_expression_layer_source.py' -v
      - name: TexTools connection regression tests
        run: python -m unittest discover -s tests -p 'test_textools_connection.py' -v
      - name: Validate manifest version and Python 3.14 Linux wheel
        run: |
          python - <<'PY'
          import pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path("blender_manifest.toml").read_text())
          assert manifest["blender_version_min"] == "5.2.0"
          assert manifest["version"] == "0.7.4"
          wheels = manifest["wheels"]
          assert any("cp314" in w and "x86_64" in w and "manylinux" in w for w in wheels)
          print("manifest validation passed")
          PY
      - name: Validate expression extraction boundary
        run: |
          python - <<'PY'
          import importlib.util
          p="features/animation/expression_presets.py"
          spec=importlib.util.spec_from_file_location("expression_presets",p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          doc={"Bones":{"j_f_mayu_l":{"Rotation":"0, 0, 0, 1"},"j_ago":{"Rotation":"0, 0, 0, 1"},"j_ude_a_l":{"Rotation":"0, 0, 0, 1"}}}
          out=m.extract_expression_document(doc)
          assert set(out["bones"])=={"j_f_mayu_l","j_ago"}
          print("expression/body isolation passed")
          PY

      - name: Package Aether Loom v0.7.4
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path(".")
          out = Path("Aether-Loom-0.7.4.zip")
          skip_roots = {".git", ".github", "__pycache__"}
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if not p.is_file() or p == out:
                      continue
                  rel = p.relative_to(root)
                  if any(part in skip_roots or part == "__pycache__" for part in rel.parts):
                      continue
                  if p.suffix in {".pyc", ".pyo"}:
                      continue
                  z.write(p, rel.as_posix())
          print(out, out.stat().st_size)
          PY
      - name: Publish Aether Loom v0.7.4
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.4 >/dev/null 2>&1; then
            echo "v0.7.4 already exists"
          else
            gh release create v0.7.4 Aether-Loom-0.7.4.zip --target main --title "Aether Loom v0.7.4" --notes "Aether Loom v0.7.4 adds the dedicated Expression Library workflow, expression extraction and blending controls, multi-expression layers, and the latest FFXIV pose-import improvements. Validated on main before packaging."
          fi
